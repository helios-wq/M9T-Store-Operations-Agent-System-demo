# Nginx：静态前端 + API 反代（关闭缓冲以支持 SSE 流式输出）
server {
    listen 80;
    server_name _;

    # 静态前端页面
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 关键配置：必须关闭缓冲，否则流式内容会被 Nginx 攒批
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查和指标
    location /healthz { proxy_pass http://app:8000; }
    location /metrics { proxy_pass http://app:8000; }

    # FastAPI 自动生成的 API 文档（Swagger UI / ReDoc / OpenAPI Schema）
    location /docs {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /redoc {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
